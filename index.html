<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shellystores | Fashion Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    a {
      text-decoration: none;
    }

    /* ================= HEADER ================= */

    header {
      background: #111111;
      color: white;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo span {
      color: #ff2875;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    nav a:hover {
      color: #ff2875;
    }

    .cart {
      background: #ff2875;
      color: white;
      padding: 10px 15px;
      border-radius: 25px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: 470px;
      padding: 55px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      background: linear-gradient(135deg, #fff0f5, #ffffff);
      overflow: hidden;
    }

    .hero-text {
      max-width: 530px;
    }

    .welcome {
      color: #ff2875;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero h1 {
      font-size: 55px;
      line-height: 1.05;
      margin: 15px 0;
    }

    .hero h1 span {
      color: #ff2875;
    }

    .hero p {
      color: #666666;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      background: #ff2875;
      color: white;
      padding: 15px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
    }

    .shop-btn:hover {
      background: #d91c5d;
    }

    .hero-image {
      width: 390px;
      height: 390px;
      border-radius: 50%;
      background: #ffd4e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 120px;
      flex-shrink: 0;
    }

    /* ================= SECTION ================= */

    section {
      padding: 55px 5%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #777777;
    }

    .line {
      width: 55px;
      height: 4px;
      background: #ff2875;
      margin: 12px auto;
      border-radius: 10px;
    }

    /* ================= PRODUCTS ================= */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product {
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: #f5f5f5;
    }

    .product-info {
      padding: 15px;
    }

    .category {
      color: #999999;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .product h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .price {
      color: #ff2875;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .add-cart {
      width: 100%;
      border: none;
      background: #111111;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-cart:hover {
      background: #ff2875;
    }

    /* ================= CATEGORIES ================= */

    .categories-section {
      background: #fff4f8;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .category-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .category-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .category-card h3 {
      margin-bottom: 8px;
    }

    .category-card p {
      color: #777777;
      margin-bottom: 15px;
    }

    .category-btn {
      display: inline-block;
      background: #ff2875;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* ================= BENEFITS ================= */

    .benefits {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding-top: 35px;
      padding-bottom: 35px;
    }

    .benefit {
      text-align: center;
      padding: 15px;
    }

    .benefit-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .benefit h4 {
      margin-bottom: 5px;
    }

    .benefit p {
      color: #777777;
      font-size: 13px;
    }

    /* ================= NEWSLETTER ================= */

    .newsletter {
      background: #111111;
      color: white;
      padding: 40px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
    }

    .newsletter h2 {
      margin-bottom: 7px;
    }

    .newsletter p {
      color: #bbbbbb;
    }

    .newsletter-form {
      display: flex;
      max-width: 500px;
      width: 100%;
    }

    .newsletter-form input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 25px 0 0 25px;
    }

    .newsletter-form button {
      border: none;
      background: #ff2875;
      color: white;
      padding: 14px 25px;
      border-radius: 0 25px 25px 0;
      font-weight: bold;
      cursor: pointer;
    }

    /* ================= FOOTER ================= */

    footer {
      background: #0b0b0b;
      color: white;
      padding: 45px 5% 20px;
    }

    .footer-content {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1.5fr 1fr;
      gap: 30px;
    }

    .footer-logo {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .footer-logo span {
      color: #ff2875;
    }

    footer p {
      color: #aaaaaa;
      line-height: 1.7;
    }

    .footer-column h3 {
      margin-bottom: 15px;
    }

    .footer-column a {
      display: block;
      color: #aaaaaa;
      margin-bottom: 9px;
    }

    .footer-column a:hover {
      color: #ff2875;
    }

    .phone {
      color: #ff2875 !important;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .social {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .social a {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin: 0;
    }

    .social a:hover {
      background: #ff2875;
      color: white;
    }

    .copyright {
      border-top: 1px solid #333333;
      margin-top: 35px;
      padding-top: 20px;
      text-align: center;
      color: #888888;
    }

    /* ================= WHATSAPP ================= */

    .whatsapp {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #25D366;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
